workflows:
  ios-release:
    name: iOS TestFlight Release
    integrations:
      app_store_connect: "Codemagic"
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild (Generate iOS folder)
        script: npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "com.valtir.app" \
            --type IOS_APP_STORE \
            --create
      - name: Use system default keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: iOS build
        script: |
          xcode-project build-ipa \
            --workspace "ios/Valtir.xcworkspace" \
            --scheme "Valtir" \
            --export-method app-store
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration # Requires connecting Apple Developer portal in Codemagic UI
        submit_to_testflight: true
